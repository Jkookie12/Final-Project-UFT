{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h2 class="text-center mb-2">Welcome Back 👋</h2>
        <p class="text-center mb-4 subtitle">
            Login to continue your writing journey.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>

            <div class="mb-3 position-relative">
                {{ form.password.label_tag }}
                {{ form.password }}

                <span class="toggle-password" onclick="togglePassword()">
                    👁
                </span>
            </div>

            <button class="btn btn-auth w-100 mt-2">
                Login
            </button>
        </form>

    </div>

</div>

<style>

/* REMOVE SCROLL */
html, body {
    height: 100%;
    overflow: hidden;
}

/* WRAPPER - MUCH HIGHER */
.auth-wrapper {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 40px;  /* 🔥 Higher position */
}

/* GLASS CARD */
.auth-card {
    width: 400px;
    padding: 40px;
    border-radius: 25px;

    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);

    color: #1e293b;
}

/* DARK MODE */
body.dark-mode .auth-card {
    background: rgba(15,23,42,0.4);
    color: #f1f5f9;
    border: 1px solid rgba(255,255,255,0.08);
}

/* SUBTITLE */
.subtitle {
    font-size: 14px;
    opacity: 0.7;
}

/* INPUTS */
.auth-card input {
    width: 100%;
    padding: 10px 40px 10px 12px;
    border-radius: 12px;
    border: none;
    margin-top: 5px;

    background: rgba(255,255,255,0.4);
    outline: none;
    transition: 0.3s ease;
}

.auth-card input:focus {
    background: rgba(255,255,255,0.6);
}

body.dark-mode .auth-card input {
    background: rgba(255,255,255,0.1);
    color: white;
}

body.dark-mode .auth-card input:focus {
    background: rgba(255,255,255,0.2);
}

/* BUTTON */
.btn-auth {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border: none;
    border-radius: 30px;
    padding: 10px;
    font-weight: 600;
    color: #1f1f1f;
    transition: 0.3s ease;
}

.btn-auth:hover {
    transform: scale(1.05);
}

/* EYE ICON */
.toggle-password {
    position: absolute;
    right: 12px;
    top: 38px;
    cursor: pointer;
    font-size: 16px;
    opacity: 0.7;
}

.toggle-password:hover {
    opacity: 1;
}

body.dark-mode .toggle-password {
    color: #f1f5f9;
}

</style>

<script>
function togglePassword() {
    const passwordInput = document.getElementById("id_password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}
</script>

{% endblock %}

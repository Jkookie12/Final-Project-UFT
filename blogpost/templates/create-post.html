{% extends "base.html" %}

{% block content %}

{% if user.is_authenticated %}

<div class="create-wrapper d-flex align-items-center justify-content-center">

    <div class="create-card">

        <h2 class="create-title">✍️ Create New Post</h2>
        <p class="create-subtitle">Share your thoughts with the world</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-content">
                {{ form.as_p }}
            </div>

            <!-- Optional Featured Image UI -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Featured Image (optional)</label>
                <input type="file" class="form-control">
            </div>

            <div class="d-flex gap-3 mt-4">
                <button class="btn btn-publish">Publish Post</button>
                <button type="button" class="btn btn-back" onclick="history.back()">Back</button>
            </div>
        </form>

    </div>

</div>

<!-- Auto assign logged-in user -->
<script>
    var name = "{{ user.id }}";
    var userField = document.getElementById("user");
    if(userField){
        userField.value = name;
    }
</script>

{% else %}
<div class="text-center mt-5">
    <h4>You are not authorized to create a post.</h4>
</div>
{% endif %}

<style>

/* Center wrapper */
.create-wrapper {
    min-height: 85vh;
}

/* Card */
.create-card {
    width: 100%;
    max-width: 700px;
    padding: 40px;
    border-radius: 25px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(25px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    transition: 0.3s ease;
}

/* Dark mode support */
body.dark-mode .create-card {
    background: rgba(30,41,59,0.6);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

/* Titles */
.create-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    margin-bottom: 5px;
}

.create-subtitle {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 30px;
}

/* Form content */
.form-content p {
    margin-bottom: 15px;
}

.form-content input,
.form-content textarea,
.form-content select {
    border-radius: 12px !important;
    padding: 10px !important;
}

/* Buttons */
.btn-publish {
    background: linear-gradient(135deg, #ff7aa2, #ff4f81);
    color: white;
    border: none;
    padding: 8px 22px;
    border-radius: 50px;
    transition: 0.3s ease;
}

.btn-publish:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 122, 162, 0.4);
}

.btn-back {
    background: #e2e8f0;
    border-radius: 50px;
    padding: 8px 22px;
}

body.dark-mode .btn-back {
    background: #334155;
    color: white;
}

</style>

{% endblock %}

{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% block content %}

<h2 class="mb-5 text-center fw-bold">Latest Blog Posts ✨</h2>

<div class="row g-4">

{% for post in posts %}
    <div class="col-md-4">
        <div class="glass-card p-4 h-100">
            <h4 class="fw-bold">{{ post.title }}</h4>
            <p class="text-muted small">By {{ post.author }} • {{ post.created_at }}</p>
            <p>{{ post.content|truncatewords:20 }}</p>

            <a href="{% url 'postdetail' post.id %}" 
               class="btn btn-sm btn-dark rounded-pill mt-2">
               Read More →
            </a>
        </div>
    </div>
{% endfor %}

</div>

{% endblock %}
